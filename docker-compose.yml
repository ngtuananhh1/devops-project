services:
frontend:
  build: ./frontend
  ports:
    - "3000:3000"
  depends_on:
    - backend
  healthcheck:
    test: ["CMD", "wget", "--spider", "http://localhost:3000"]
    interval: 10s
    timeout: 5s
    retries: 5

backend:
  build: ./backend
  ports:
    - "8080:8080"
  environment:
    - DB_HOST=postgres
    - DB_USER=postgres
    - DB_PASSWORD=postgres
    - DB_NAME=postgres
  depends_on:
    - postgres
  healthcheck:
    test: ["CMD", "wget", "--spider", "http://localhost:8080/health"]
    interval: 10s
    timeout: 5s
    retries: 5

  postgres:
    image: postgres:14-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres"]
    interval: 10s
    timeout: 5s
    retries: 5

volumes:
  postgres_data: